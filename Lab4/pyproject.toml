[project]
name = "sphere-color-lab4"
version = "1.0.0"
description = "ЛР4 АКГ: восстановление спектров из RGB на основе Lab3"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "matplotlib>=3.7", "pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
report = ["python-docx>=1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sphere_color"]

[tool.setuptools.package-data]
sphere_color = ["data/*.csv"]
